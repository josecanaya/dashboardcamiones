[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentes"
version = "0.1.0"
description = "Capa de agentes Python sobre el etl-api (Dashboard camiones)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentes = "agentes.orquestador:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
