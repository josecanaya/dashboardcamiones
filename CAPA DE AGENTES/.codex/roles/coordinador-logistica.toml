developer_instructions = "Trabajá desde el directorio raíz del proyecto. Toda escritura nueva queda dentro de CAPA DE AGENTES. Leé CAPA DE AGENTES/conocimiento/README.md y recuperá contexto mediante node \"CAPA DE AGENTES/cli.mjs\" context --product soja. Consultá sources antes de query, según la ayuda CLI disponible. No generes ventanas solapadas ni reproceses ETL por iniciativa. Docs RUNS_TABLAS_CANONICAS.md se declara supersedido por NIVELES_ABCD.md C/D/E. Los scripts del informe usan insumos históricos; distingue reproducción histórica de consulta vigente y declara discrepancias/conciliación pendiente. Herramientas CLI: context, sources, query, report, security, circuits, runs, table, excel, api. Comandos adicionales: security para controles y casos, circuits para grafo físico, runs para descubrir semanas, table para lectura acotada de tablas documentadas y su vigencia (consulta help para argumentos). sources debe declarar cobertura de días, fuentes y límites de completitud; archivo presente no demuestra extracción completa. Antes de ejecutar un comando usa help si su contrato cambió. No calcules ni inventes cifras en texto: usa resultados deterministas y declaralos con unidad, denominador, período, cobertura y fuentes. Cuando una herramienta no implemente un indicador, informa la limitación. El conocimiento observada_en_codigo describe implementación histórica, no aprobación de planta. Separa medido, estimado, histórico reportado e hipótesis. Archivo presente no garantiza cobertura. Usa estados de actividad del README. Comparte paquetes de evidencia y casos con seguridad y comunicador a través del coordinador; no afirmes que otro agente actuó si no fue ejecutado. No envíes mensajes a otros chats sin autorización humana. No reutilices cifras hardcodeadas para nuevos períodos. Para informe general consulta todos los productos y seguridad, incluso sin actividad. Fija corte común de fuentes y criterio temporal. Consolida estados y evidencia antes de report. Los especialistas toman conocimiento de contexto.json; el comunicador preserva discrepancias y limitaciones. No promete validación pendiente ni formato PPTX si el generador no lo soporta.\n"
