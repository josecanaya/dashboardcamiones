<title>Habilitación de Vehículos Nodo Sur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: bandeja administrativa — lista de vehículos a la izquierda (última captura primero), ficha a la derecha. Paleta clara de En vivo (verde NVA). */
:root{
  --ink:#10231a; --muted:#5d6f65; --line:#dbe5df; --panel:#ffffff; --bg:#f3f6f4;
  --brand:#0f4a33; --brand-2:#16603f; --brand-soft:#e6f1eb; --on-brand:#ffffff; --on-brand-mute:#bfe3cf;
  --ok:#16a34a; --ok-soft:#ecfdf3; --warn:#b45309; --warn-soft:#fff7e6; --bad:#dc2626; --bad-soft:#fdecec;
  --sans:'Public Sans','Segoe UI',Arial,sans-serif; --mono:'IBM Plex Mono',Consolas,ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:10px;min-height:560px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 16px;border-radius:14px;background:var(--brand);color:var(--on-brand)}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--on-brand-mute)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--on-brand-mute)}
.prog b{color:var(--on-brand);font-size:15px;font-variant-numeric:tabular-nums}
.prog .track{width:120px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.prog .track i{display:block;height:100%;background:#4ade80}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.live i{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.live.on i{background:#4ade80} .live.off i{background:#f59e0b}

.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:10px}
.side,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-transform:uppercase;background:var(--panel)}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--bg)}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--brand);box-shadow:0 1px 2px rgba(16,35,26,.12)}
.planta-seg{background:var(--brand-soft)}
.planta-seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);box-shadow:none}
.seg .n{font-weight:600;opacity:.7;margin-left:3px;font-variant-numeric:tabular-nums}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 6px 10px}
.day{position:sticky;top:0;z-index:1;background:var(--panel);padding:10px 8px 4px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item{width:100%;display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;padding:7px;border-radius:10px;border:1px solid transparent;background:none;text-align:left}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--brand-soft);border-color:#b9d6c6}
.item img,.item .noimg{width:76px;height:52px;border-radius:7px;object-fit:cover;background:var(--bg);display:block}
.item .l1{display:flex;align-items:center;justify-content:space-between;gap:6px}
.item strong{font:700 14.5px var(--mono);letter-spacing:.02em}
.item .l2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:#c3cfc8}
.st.hab{color:var(--ok)} .st.hab i{background:var(--ok)}
.st.desv{color:var(--bad)} .st.desv i{background:var(--bad)}
.st.venc{color:var(--warn)} .st.venc i{background:var(--warn)}
.st.bor{color:var(--warn)} .st.bor i{background:#f59e0b}
.empty{padding:16px 10px;color:var(--muted);font-size:13px}

.card{overflow-y:auto}
.detail{padding:16px 18px 20px;display:flex;flex-direction:column;gap:18px}
.photo{display:flex;flex-direction:column;gap:8px}
.photo .main{position:relative;border-radius:12px;overflow:hidden;background:var(--bg);aspect-ratio:16/9;max-height:440px}
.photo .main img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.photo .main img.zoom{object-fit:contain;cursor:zoom-out;background:#0c1913}
.photo .cap{position:absolute;left:10px;bottom:10px;background:rgba(12,25,19,.78);color:#fff;font-size:12px;padding:4px 9px;border-radius:6px}
.photo .thumbs{display:flex;gap:8px}
.photo .thumbs button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:none;width:110px}
.photo .thumbs button[aria-pressed="true"]{border-color:var(--brand)}
.photo .thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.idbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.plate{font:700 26px var(--mono);letter-spacing:.04em;border:2px solid var(--ink);border-radius:7px;padding:1px 12px;background:var(--panel)}
.facts{display:flex;flex-direction:column;gap:3px;min-width:0}
.facts p{margin:0;color:var(--muted);font-size:13px}
.facts p b{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;font-weight:600;background:var(--bg);color:var(--muted);border-radius:6px;padding:2px 8px}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.big-st{font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--bg);color:var(--muted)}
.big-st.hab{background:var(--ok-soft);color:var(--ok)} .big-st.desv{background:var(--bad-soft);color:var(--bad)} .big-st.venc{background:var(--warn-soft);color:var(--warn)}

.blk h2{margin:0 0 4px;font-size:15px;font-weight:800}
.blk .help{margin:0 0 10px;color:var(--muted);font-size:12.5px}
.plantas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.planta h3{margin:0 0 6px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.secs{display:flex;flex-direction:column;gap:5px}
.sec{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.sec:hover{border-color:#b9d6c6}
.sec .box{width:18px;height:18px;border-radius:5px;border:1.5px solid #9fb2a7;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--on-brand)}
.sec[aria-pressed="true"]{background:var(--brand-soft);border-color:#9cc9b1}
.sec[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand)}
.sec .nm{font-weight:600;font-size:13px}
.sec .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec.out .cnt{color:var(--warn);font-weight:700}
.sec:disabled{cursor:default}
.note{margin-top:10px;padding:9px 12px;border-radius:9px;font-size:13px}
.note.ok{background:var(--ok-soft)} .note.w{background:var(--warn-soft)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.lnk{border:0;background:none;padding:0;color:var(--brand-2);font-weight:700;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label,.fld .lab{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);width:100%;min-width:0}
.fld input:focus,.fld select:focus{border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dias{display:flex;gap:5px;flex-wrap:wrap}
.dia{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:12.5px;color:var(--muted)}
.dia[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.hist{margin:10px 0 0;padding:0;list-style:none;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

.bar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:700;font-size:13px}
.btn:hover{border-color:#9fb2a7}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-2)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;font-weight:600;color:var(--ok)} .msg.e{color:var(--bad)} .msg.d{color:var(--warn)}
.bar .sp{flex:1}

@media (max-width:860px){
  html,body{height:auto} .app{height:auto}
  .body{grid-template-columns:minmax(0,1fr)} .list{max-height:300px}
  .plantas,.form{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

        <div class="seg" id="seg"></div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main class="card" id="card"></main>
  </div>
</div>

const total = v => Object.values(v.v).reduce((a,b)=>a+b,0);

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secNombre = k => { const [pl,s] = k.split(':'); const it = SECTORES[pl].items.find(x=>x[0]===s); return (it?it[1]:s) + (pl==='ric'?' (Ricardone)':' (puerto)'); };
const hhmm = iso => iso.slice(11,16);
function diaTxt(iso){

  const ay = new Date(hoy); ay.setDate(hoy.getDate()-1);
  if (d === loc(hoy)) return 'Hoy';
  if (d === loc(ay)) return 'Ayer';
  const dt = new Date(d+'T12:00');
  return `${DSEM[dt.getDay()]} ${dt.getDate()} de ${MES[dt.getMonth()]}`;
}
const fechaCorta = iso => `${iso.slice(8,10)}/${iso.slice(5,7)} ${hhmm(iso)}`;

function conocido(v){ const t = total(v); return Object.entries(v.v).filter(([,n]) => n >= 3 && n/t >= .05).map(([k])=>k); }

function estado(v){
  const f = remote[v.p];
  if (!f) return 'pend';
  if (f.estado !== 'hab') return 'bor';

  return fuera(v,f).length ? 'desv' : 'hab';
}

function renderTop(){

const enPlanta = (v, pl = planta) => pl === 'ambas' || Object.keys(v.v).some(k => k.startsWith(pl + ':'));

function renderPlanta(){
  document.getElementById('planta').innerHTML = [['ric','Ricardone'],['sl','San Lorenzo'],['ambas','Ambas']]

function visibles(){
  return DATA.lista.filter(v => {
    if (!enPlanta(v)) return false;
    if (q && !v.p.includes(q)) return false;
    const e = estado(v);
    if (filtro==='pend') return pendiente(e);
    if (filtro==='hab') return !pendiente(e);
    return true;
  }).sort(porUltima);
}

function renderSeg(){
  const de = DATA.lista.filter(v => enPlanta(v)), c = {pend:0, hab:0, todos:de.length};

    .map(([k,l]) => `<button data-f="${k}" aria-pressed="${filtro===k}">${l}<span class="n">${c[k]}</span></button>`).join('');

function renderList(){
  const rows = visibles(), el = document.getElementById('list');

  let html = '', grupo = '';
  for (const v of rows){
    const u = ultima(v), fs = fotosDe(v), g = diaTxt(u[0]);
    if (g !== grupo){ grupo = g; html += `<div class="day">${g}</div>`; }

      <span class="l2" style="display:block">${hhmm(u[0])} · ${esc(u[1])}</span></span>

}

async function resolverNombres(ids){
  const faltan = ids.filter(id => !(id in nombres));
  if (!user || !faltan.length) return;
  try {
    const ps = await user.profiles(faltan); let cambio = false;
    for (const id of faltan){ nombres[id] = ps[id]?.name || ''; if (nombres[id]) cambio = true; }
    if (cambio && !drafts[sel]) renderCard();
  } catch(e) {}
}

function renderAll(){ renderTop(); renderPlanta(); renderSeg(); renderList(); renderCard(); }
function draft(){ const v = DATA.lista.find(x=>x.p===sel); if (!drafts[v.p]) drafts[v.p] = clone(ficha(v)); return [drafts[v.p], v]; }
function elegir(p){
  sel = p; fotoIdx = 0; zoom = false; renderList(); renderCard();
  document.getElementById('card').scrollTop = 0;
  const it = document.querySelector(`.item[data-p="${p}"]`); if (it) it.scrollIntoView({block:'nearest'});
}
function siguiente(rows = visibles()){
  const idx = rows.findIndex(v=>v.p===sel);
  const sig = rows[idx+1] || rows.find(v=>v.p!==sel && pendiente(estado(v)));
  if (sig) elegir(sig.p); else renderAll();
}

async function guardar(v, f, accion){
  const ahora = new Date().toISOString();
  const doc = {...f, propuesto:false, updatedAt:ahora, updatedBy:uid || null,
    historial:[...(remote[v.p]?.historial || []), {t:ahora, a:accion, by:uid || null}].slice(-30)};
  if (modo === 'on') await db.collection('habilitaciones').doc(v.p).set(doc);
  else { remote[v.p] = doc; try { localStorage.setItem(LS, JSON.stringify(remote)); } catch(e) {} }
  delete drafts[v.p];
}

});
document.getElementById('card').addEventListener('click', async e => {
  if (e.target.id === 'foto'){ zoom = !zoom; e.target.classList.toggle('zoom', zoom); return; }
  const ft = e.target.closest('[data-foto]'); if (ft){ fotoIdx = +ft.dataset.foto; return renderCard(); }
  const act = e.target.closest('[data-act]');
  if (act?.dataset.act === 'siguiente') return siguiente();
  if (!canWrite) return;
  const sec = e.target.closest('[data-sec]'), dia = e.target.closest('[data-dia]');
  if (sec){ const [f] = draft(); const k = sec.dataset.sec; f.permit = f.permit.includes(k) ? f.permit.filter(x=>x!==k) : [...f.permit,k]; f.propuesto = false; return renderCard(); }
  if (dia){ const [f] = draft(); const j = +dia.dataset.dia; f.dias = f.dias.includes(j) ? f.dias.filter(x=>x!==j) : [...f.dias,j].sort(); return renderCard(); }
  if (!act) return;
  const a = act.dataset.act;
  if (a==='conocido'){ const [f,v] = draft(); f.permit = conocido(v); return renderCard(); }
  if (a==='todo'){ const [f,v] = draft(); f.permit = Object.keys(v.v); f.propuesto = false; return renderCard(); }
  const [f, v] = draft();
  act.disabled = true;
  try {
    if (a==='habilitar'){
      const falta = [['titular','titular'],['resp','sector responsable'],['vig','autorizado hasta'],['autoriza','quién autoriza']].filter(([k])=>!f[k]).map(x=>x[1]);
      if (falta.length){ aviso = {t:'Falta completar: ' + falta.join(', '), c:'e'}; return renderCard(); }
      const orden = visibles();   // antes de guardar: con el filtro «Por revisar» el habilitado sale de la lista
      f.estado = 'hab'; await guardar(v, f, 'Habilitó');
      renderTop(); renderSeg(); return siguiente(orden);
    }
    if (a==='borrador'){ await guardar(v, f, f.estado==='hab' ? 'Modificó la autorización' : 'Guardó borrador'); aviso = {t:'Guardado'}; return renderAll(); }
    if (a==='revocar'){ f.estado = 'pend'; await guardar(v, f, 'Quitó la habilitación'); aviso = {t:'Habilitación quitada'}; return renderAll(); }
  } catch(err) {
    if (err?.code === 'invalid_argument' && modo === 'on'){ canWrite = false; setModo('on'); return renderCard(); }
    aviso = {t:'No se pudo guardar. Probá de nuevo en un momento.', c:'e'}; return renderCard();
  }
});

function modoLocal(){
  try { remote = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch(e) { remote = {}; }
  setModo('local'); renderAll();
}

setModo('cargando');
renderAll();
(async () => {
  const c = window.claude;
  if (!c?.use) return modoLocal();
  const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
  if (!d) return modoLocal();
  db = d; user = u;
  if (user){
    try { uid = await user.id(); } catch(e) {}
    try { if (await user.can('data.write') === false) canWrite = false; } catch(e) {}
  }
  db.collection('habilitaciones').onSnapshot(s => {
    const r = {}; s.docs.forEach(x => { r[x.id] = x.data(); }); remote = r;
    setModo('on'); renderTop(); renderSeg(); renderList();
    if (!drafts[sel]) renderCard();   // no pisar lo que se está escribiendo
  }, () => modoLocal());
})();
</script>
